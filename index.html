<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ミニゲームコレクション</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-arcade {
      font-family: 'DotGothic16', sans-serif;
    }
    .glow-cyan { box-shadow: 0 0 20px rgba(6, 182, 212, 0.35); }
    .glow-gold { box-shadow: 0 0 25px rgba(245, 158, 11, 0.45); }
    .glow-rose { box-shadow: 0 0 25px rgba(244, 63, 94, 0.45); }
    .glow-purple { box-shadow: 0 0 20px rgba(168, 85, 247, 0.35); }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #273549;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b4f6c;
    }

    .game-card-dark {
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .game-card-dark:hover:not(.disabled) {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 12px 25px -5px rgba(0, 0, 0, 0.6);
      border-color: #475569;
    }
    a.game-card-dark:active { transform: scale(0.96); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black">

  <!-- ==================== HEADER BAR ==================== -->
  <header class="bg-slate-900/90 border-b border-slate-800/80 px-4 py-2.5 sticky top-0 z-30 backdrop-blur-md">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500 via-teal-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/25">
          <span class="text-xl">🎮</span>
        </div>
        <div>
          <h1 class="font-arcade text-lg sm:text-xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-amber-300 to-rose-400">
            GAME CENTER
          </h1>
          <p class="text-[11px] text-slate-400 hidden sm:block">Mini Game Collection</p>
        </div>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN ==================== -->
  <main class="max-w-6xl w-full mx-auto p-3 sm:p-5 flex-1 flex flex-col justify-center">
    <div class="grid grid-cols-2 gap-4 max-w-md w-full mx-auto">
      <a href="game1/index.html" class="game-card-dark bg-slate-900/80 border border-slate-800 rounded-2xl flex flex-col items-center justify-center aspect-square text-decoration-none p-4">
        <div class="text-5xl mb-2">🧠</div>
        <div class="font-bold text-sm sm:text-base text-slate-100 text-center">心理戦バトル</div>
        <div class="text-[11px] text-slate-400 mt-1">オンライン / NPC対戦</div>
        <div class="text-[11px] text-cyan-400 font-bold mt-2">PLAY →</div>
      </a>

      <a href="game2/index.html" class="game-card-dark bg-slate-900/80 border border-slate-800 rounded-2xl flex flex-col items-center justify-center aspect-square text-decoration-none p-4">
        <div class="text-5xl mb-2">⚔️</div>
        <div class="font-bold text-sm sm:text-base text-slate-100 text-center">GAME CENTER TCG</div>
        <div class="text-[11px] text-slate-400 mt-1">10枚ハイランダー対戦</div>
        <div class="text-[11px] text-amber-400 font-bold mt-2">PLAY →</div>
      </a>

      <div class="game-card-dark disabled bg-slate-900/80 border border-slate-800 rounded-2xl flex flex-col items-center justify-center aspect-square opacity-50 p-4" onclick="alert('制作中！')">
        <div class="text-5xl mb-2">⚡</div>
        <div class="font-bold text-sm sm:text-base text-slate-100 text-center">ゲーム 3</div>
        <div class="text-[11px] text-slate-400 mt-1">近日公開</div>
      </div>

      <div class="game-card-dark disabled bg-slate-900/80 border border-slate-800 rounded-2xl flex flex-col items-center justify-center aspect-square opacity-50 p-4" onclick="alert('制作中！')">
        <div class="text-5xl mb-2">🎲</div>
        <div class="font-bold text-sm sm:text-base text-slate-100 text-center">ゲーム 4</div>
        <div class="text-[11px] text-slate-400 mt-1">近日公開</div>
      </div>
    </div>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="text-center py-2.5 text-slate-600 text-xs border-t border-slate-900 bg-slate-950">
    Game Center &copy; 2026 - Mini Game Collection
  </footer>

</body>
</html>
